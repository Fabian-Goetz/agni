<!doctype html>
<html lang="de" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agni · Beladung</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@500;600;700&family=Roboto+Mono:wght@400;500&family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root, :root[data-theme="light"] {
    --signal:#E5352B; --signal-hi:#C82820; --sodium:#B8791C; --go:#2FA35F;
    --paper:#191A1C; --muted:#4B4E54; --faint:#9AA0A8;
    --steel:#D6D1C8; --steel-lo:#E4E0D9;
    --panel:#FFFFFF; --panel-2:#FBFAF7; --line-2:#D6D1C8; --bay:#F6F4F0;
    --bg-image:
      radial-gradient(120% 90% at 22% 6%, #FFFFFF 0%, #F6F4F0 52%, #EFEBE4 100%),
      linear-gradient(rgba(0,0,0,0.028) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,0,0,0.028) 1px, transparent 1px);
    --card-bg:#FFFFFF; --track:#ECE8E1; --sel-bg:rgba(244,184,96,0.10);
    --hole:#FFFFFF; --plate-bg:#FFFFFF; --hatch:rgba(0,0,0,0.035);
    --focus-ring:0 0 0 3px rgba(229,53,43,0.28); --icon:#4E5B6E;
  }
  :root[data-theme="dark"] {
    --signal:#E5352B; --signal-hi:#FF574C; --sodium:#F4B860; --go:#46D07E;
    --paper:#E8EAED; --muted:#8A94A3; --faint:#5A6473;
    --steel:#262E3A; --steel-lo:#1E242D;
    --panel:#161A21; --panel-2:#1B2029; --line-2:#262E3A; --bay:#0E1116;
    --bg-image:
      radial-gradient(120% 90% at 22% 8%, #171C25 0%, #0E1116 46%, #0B0E12 100%),
      linear-gradient(#1E242D 1px, transparent 1px),
      linear-gradient(90deg, #1E242D 1px, transparent 1px);
    --card-bg:linear-gradient(180deg,#161A21,#12161D); --track:#1E242D; --sel-bg:rgba(244,184,96,0.10);
    --hole:#12161D; --plate-bg:rgba(22,26,33,0.6); --hatch:rgba(90,100,115,0.05);
    --focus-ring:0 0 0 3px rgba(244,184,96,0.4); --icon:#5A6675;
  }
  :root { --radius:4px; --maxw:1240px;
    --font-display:"Roboto Condensed",system-ui,sans-serif; --font-body:"Roboto",system-ui,sans-serif; --font-mono:"Roboto Mono",ui-monospace,monospace; }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body { margin:0; font-family:var(--font-body); color:var(--paper); line-height:1.5; -webkit-font-smoothing:antialiased;
    background:var(--bay); background-image:var(--bg-image); background-size:100% 100%, 34px 34px, 34px 34px; transition:background-color .25s, color .25s; }
  .shell { min-height:100%; max-width:var(--maxw); margin:0 auto; padding:clamp(20px,3.2vw,44px) clamp(20px,4vw,56px); display:flex; flex-direction:column; gap:clamp(22px,2.6vw,36px); }

  .topbar { display:flex; align-items:center; justify-content:space-between; gap:24px; }
  .brand { display:flex; align-items:baseline; gap:12px; }
  .brand .mark { font-family:var(--font-display); font-weight:700; font-size:28px; letter-spacing:0.14em; line-height:1; position:relative; padding-left:19px; }
  .brand .mark::before { content:""; position:absolute; left:0; top:50%; width:10px; height:10px; transform:translateY(-50%) rotate(45deg); background:var(--signal); }
  .brand .sub { font-family:var(--font-mono); font-size:11px; letter-spacing:0.28em; text-transform:uppercase; color:var(--faint); }
  .tools { display:flex; align-items:center; gap:14px; }
  .avatar { width:32px; height:32px; border-radius:var(--radius); background:var(--panel-2); border:1px solid var(--steel); display:grid; place-items:center; font-family:var(--font-display); font-weight:700; color:var(--sodium); font-size:15px; }
  .theme-toggle { width:38px; height:38px; flex:none; display:inline-flex; align-items:center; justify-content:center; border:1px solid var(--line-2); border-radius:var(--radius); background:var(--plate-bg); color:var(--muted); cursor:pointer; transition:border-color .15s, color .15s; }
  .theme-toggle:hover { border-color:var(--muted); color:var(--paper); }
  .theme-toggle svg { width:18px; height:18px; }
  :root[data-theme="dark"] .theme-toggle .i-sun{display:block;} :root[data-theme="dark"] .theme-toggle .i-moon{display:none;}
  :root[data-theme="light"] .theme-toggle .i-sun{display:none;} :root[data-theme="light"] .theme-toggle .i-moon{display:block;}

  .back { font-family:var(--font-mono); font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:var(--muted); text-decoration:none; display:inline-flex; align-items:center; gap:8px; }
  .back:hover { color:var(--paper); }
  .eyebrow { font-family:var(--font-mono); font-size:12px; letter-spacing:0.34em; text-transform:uppercase; color:var(--signal); margin:16px 0 12px; display:flex; align-items:center; gap:12px; }
  .eyebrow::after { content:""; height:1px; flex:0 0 80px; background:linear-gradient(90deg,var(--signal),transparent); }
  .page-head h1 { font-family:var(--font-display); font-weight:600; font-size:clamp(30px,4.2vw,46px); line-height:1; letter-spacing:-0.01em; margin:0; }
  .page-head p { color:var(--muted); font-size:15px; margin:12px 0 0; }
  .page-head p a { color:var(--sodium); text-decoration:none; }
  .page-head p a:hover { text-decoration:underline; }

  /* read-only vehicle picker */
  .pick { display:grid; grid-template-columns:repeat(3,1fr); gap:clamp(14px,1.5vw,20px); }
  .veh { position:relative; text-align:left; background:var(--card-bg); border:1px solid var(--steel); border-radius:var(--radius); padding:20px; cursor:pointer; color:var(--paper); display:flex; flex-direction:column; gap:12px; transition:border-color .15s; }
  .veh:hover:not(.locked) { border-color:var(--sodium); }
  .veh .thumb { color:var(--icon); }
  .veh .thumb .hole { fill:var(--hole); }
  .veh .name-row { display:flex; align-items:baseline; gap:10px; }
  .veh h2 { font-family:var(--font-display); font-weight:600; font-size:20px; margin:0; }
  .veh .type { font-family:var(--font-mono); font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--sodium); }
  .veh .status { font-family:var(--font-mono); font-size:12px; color:var(--muted); display:flex; align-items:center; gap:10px; }
  .bar { flex:1; height:6px; border-radius:3px; background:var(--track); overflow:hidden; }
  .bar > i { display:block; height:100%; background:var(--sodium); }
  .veh .go { font-family:var(--font-mono); font-size:12px; letter-spacing:0.1em; text-transform:uppercase; color:var(--signal); margin-top:2px; }

  .veh.locked { cursor:not-allowed; opacity:0.8; }
  .veh.locked::after { content:""; position:absolute; inset:0; pointer-events:none; border-radius:var(--radius); background:repeating-linear-gradient(-45deg, transparent 0 9px, var(--hatch) 9px 10px); }
  .soon { font-family:var(--font-mono); font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color:var(--faint); border:1px dashed var(--steel); border-radius:2px; padding:3px 7px; align-self:flex-start; }

  .footer { display:flex; flex-wrap:wrap; gap:10px 22px; margin-top:auto; font-family:var(--font-mono); font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:var(--faint); border-top:1px solid var(--steel-lo); padding-top:18px; }
  .footer span b { color:var(--muted); font-weight:400; }

  @media (max-width:820px){ .pick{ grid-template-columns:1fr; } }
</style>
</head>
<body>
  <div class="shell">

    <header class="topbar">
      <div class="brand"><div class="mark">AGNI</div><div class="sub">Fahrzeugkunde</div></div>
      <div class="tools">
        <button class="theme-toggle" type="button" aria-label="Design umschalten" onclick="__toggleTheme()">
          <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8L6 18M18 6l1.8-1.8"/></svg>
        </button>
        <div class="avatar">FK</div>
      </div>
    </header>

    <div class="page-head">
      <a class="back" href="05-geraetehaus.html">← Gerätehaus</a>
      <p class="eyebrow">Gerätehaus · Beladung</p>
      <h1>Welches Fahrzeug beladen?</h1>
      <p>Wähle ein Fahrzeug — dann bestückst du seine Fächer.
        Fahrzeuge anlegen oder umbenennen? → <a href="06-fuhrpark.html">Fuhrpark</a></p>
    </div>

    <section class="pick">

      <!-- LF -->
      <button class="veh" type="button">
        <span class="thumb">
          <svg width="76" height="46" viewBox="0 0 72 44" fill="none" aria-hidden="true">
            <path d="M6 12 L6 34 L66 34 L66 16 L60 12 Z" stroke="currentColor" stroke-width="1.6"/>
            <path d="M6 12 L6 34 L24 34 L24 15 L17 12 Z" stroke="currentColor" stroke-width="1.6"/>
            <rect x="30" y="18" width="14" height="14" stroke="currentColor" stroke-width="1.2"/>
            <rect x="48" y="18" width="14" height="14" stroke="currentColor" stroke-width="1.2"/>
            <circle cx="20" cy="34" r="6" class="hole" stroke="currentColor" stroke-width="1.6"/>
            <circle cx="54" cy="34" r="6" class="hole" stroke="currentColor" stroke-width="1.6"/>
          </svg>
        </span>
        <div class="name-row"><h2>FF Konstanz</h2><span class="type">LF 20</span></div>
        <div class="status"><span>18/26</span><span class="bar"><i style="width:69%"></i></span></div>
        <span class="go">Beladen →</span>
      </button>

      <!-- TLF -->
      <button class="veh" type="button">
        <span class="thumb">
          <svg width="76" height="46" viewBox="0 0 72 44" fill="none" aria-hidden="true">
            <path d="M6 14 L6 34 L66 34 L66 18 L58 14 Z" stroke="currentColor" stroke-width="1.6"/>
            <path d="M6 14 L6 34 L22 34 L22 17 L16 14 Z" stroke="currentColor" stroke-width="1.6"/>
            <ellipse cx="46" cy="22" rx="14" ry="6" stroke="currentColor" stroke-width="1.2"/>
            <circle cx="20" cy="34" r="6" class="hole" stroke="currentColor" stroke-width="1.6"/>
            <circle cx="54" cy="34" r="6" class="hole" stroke="currentColor" stroke-width="1.6"/>
          </svg>
        </span>
        <div class="name-row"><h2>Tanker</h2><span class="type">TLF 3000</span></div>
        <div class="status"><span>9/20</span><span class="bar"><i style="width:45%"></i></span></div>
        <span class="go">Beladen →</span>
      </button>

      <!-- HLF: schema folgt -->
      <button class="veh locked" type="button" disabled>
        <span class="thumb">
          <svg width="76" height="46" viewBox="0 0 72 44" fill="none" aria-hidden="true">
            <path d="M6 12 L6 34 L66 34 L66 16 L60 12 Z" stroke="currentColor" stroke-width="1.6"/>
            <path d="M6 12 L6 34 L24 34 L24 15 L17 12 Z" stroke="currentColor" stroke-width="1.6"/>
            <circle cx="20" cy="34" r="6" class="hole" stroke="currentColor" stroke-width="1.6"/>
            <circle cx="54" cy="34" r="6" class="hole" stroke="currentColor" stroke-width="1.6"/>
          </svg>
        </span>
        <div class="name-row"><h2>Florian 2</h2><span class="type">HLF 20</span></div>
        <span class="soon">Schema folgt</span>
      </button>

    </section>

    <footer class="footer">
      <span><b>Beladung</b> · Werkbank</span>
      <span>Verwalten im <b>Fuhrpark</b></span>
      <span>Geräte aus dem <b>Katalog</b></span>
    </footer>

  </div>

  <script>
    (function () {
      var root = document.documentElement;
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      root.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
    })();
    function __toggleTheme() {
      var root = document.documentElement;
      root.setAttribute('data-theme', root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    }
  </script>
</body>
</html>
